<div class="flex flex-col items-start justify-between gap-4 sm:flex-row">
  <div>
    <h1 class="text-3xl font-bold tracking-tight md:text-4xl xl:text-5xl">
      {{ title() }}
    </h1>

    @if (originalTitle() !== title()) {
      <p class="mt-2 text-sm text-zinc-400">Título original: {{ originalTitle() }}</p>
    }
  </div>

  <button
    appButton
    variant="primary"
    size="sm"
    class="w-full shrink-0 sm:w-auto"
    type="button"
    [disabled]="!isReady()"
    [attr.aria-pressed]="isFavorite()"
    (click)="toggleFavorite()"
  >
    {{ isFavorite() ? 'Favoritado' : 'Favoritar' }}

    <svg
      lucideHeart
      [size]="18"
      [strokeWidth]="1"
      [attr.fill]="isFavorite() ? 'currentColor' : 'none'"
      aria-hidden="true"
    ></svg>
  </button>
</div>
