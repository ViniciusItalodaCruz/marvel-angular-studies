@if (genres().length) {
  <div class="flex flex-wrap gap-2">
    @for (genre of genres(); track genre.id) {
      <span
        class="rounded-full border border-white/15 bg-white/5 px-4 py-1.5 text-xs font-medium backdrop-blur-sm md:text-sm"
      >
        {{ genre.name }}
      </span>
    }
  </div>
}
