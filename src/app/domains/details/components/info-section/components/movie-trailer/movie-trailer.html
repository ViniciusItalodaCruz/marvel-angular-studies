@if (trailer(); as trailer) {
  <a
    [href]="'https://www.youtube.com/watch?v=' + trailer.key"
    target="_blank"
    rel="noopener noreferrer"
    class="flex w-full items-center justify-center gap-3 rounded-lg bg-red-600 px-6 py-3 text-sm font-semibold transition-colors hover:bg-red-700 sm:w-fit"
  >
    <span>▶</span>

    Assistir ao trailer
  </a>
}
