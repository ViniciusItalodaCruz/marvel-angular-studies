@if (mainCast().length) {
  <section class="space-y-4">
    <h2 class="text-lg font-semibold text-red-400">Elenco principal</h2>

    <div class="grid grid-cols-2 gap-4 min-[400px]:grid-cols-3 sm:grid-cols-4 xl:grid-cols-6">
      @for (person of mainCast(); track person.credit_id) {
        <article class="group min-w-0">
          <div class="mb-2 aspect-[2/3] overflow-hidden rounded-lg bg-zinc-800">
            @if (person.profile_path) {
              <img
                [src]="'https://image.tmdb.org/t/p/w185' + person.profile_path"
                [alt]="person.name"
                class="size-full object-cover transition-transform duration-300 group-hover:scale-105"
                loading="lazy"
              />
            } @else {
              <div class="grid size-full place-items-center text-3xl">
                {{ person.name.charAt(0) }}
              </div>
            }
          </div>

          <h3 class="text-xs font-semibold leading-snug md:text-sm">
            {{ person.name }}
          </h3>

          <p class="mt-1 text-xs text-zinc-400">
            {{ person.character }}
          </p>
        </article>
      }
    </div>
  </section>
}
