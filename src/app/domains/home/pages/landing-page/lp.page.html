@if (slides$ | async; as slides) {
  @if (slides.length > 0) {
    <app-hero-slider [slides]="slides" [intervalMs]="6000" />
  }
}

@if (movieCards$ | async; as cards) {
  <app-movie-row title="Em alta nesta semana" [movies]="cards" />
}

@if (nowPlayingMovies$ | async; as movies) {
  <app-movie-row title="Agora no cinema" [movies]="movies" />
}
