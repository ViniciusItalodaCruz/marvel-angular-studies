<main class="px-4 font-serif container mx-auto py-8">
  <h1 class="text-4xl text-white mb-6">
    You are searching for: <strong class="text-red-600">{{ searchTerm }}</strong>
  </h1>

  @if (hasSearchTerm) {
    <div class="flex flex-col items-center justify-center gap-4 mt-52">
      <p class="text-white text-center bg-black/50 p-4 rounded-lg">
        Your results is empty. Please try again with a different search term.
      </p>

      <button appButton size="lg" variant="primary" (click)="navigateToHome()">
        <svg lucideHouse [size]="12" color="white" [strokeWidth]="1" title="Back to home"></svg>
        Back to home
      </button>
    </div>
  }
</main>
