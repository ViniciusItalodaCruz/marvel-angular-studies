@if (movie$ | async; as movie) {
  <section
    class="relative isolate min-h-screen w-full bg-zinc-950 bg-cover bg-center bg-no-repeat"
    [style.backgroundImage]="'url(https://image.tmdb.org/t/p/original' + movie.backdrop_path + ')'"
  >
    <div class="absolute inset-0 -z-10 bg-black/50 backdrop-blur-sm"></div>

    <div
      class="container mx-auto flex min-h-screen w-full flex-col justify-between gap-12 px-4 py-24 md:flex-row md:px-0"
    >
      <app-info-section class="w-full flex-1" [movie]="movie" />

      <div class="w-full max-w-96 shrink-0 overflow-hidden rounded-lg shadow-2xl">
        <img
          [src]="'https://image.tmdb.org/t/p/original' + movie.poster_path"
          [alt]="movie.title"
          class="h-auto w-full object-cover"
        />
      </div>
    </div>
  </section>
} @else {
  <app-loading />
}
