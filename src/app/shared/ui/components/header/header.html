<header
  class="fixed inset-x-0 top-0 z-50 transition-colors duration-200"
  [class.bg-zinc-900/50]="isScrolled()"
  [class.backdrop-blur-sm]="isScrolled()"
>
  <div
    class="container mx-auto grid w-full grid-cols-[1fr_auto] items-center gap-3 px-4 py-3 md:grid-cols-[auto_minmax(0,1fr)_auto] md:h-16 md:py-0"
  >
    <app-logo />

    <app-input-search
      class="col-span-2 row-start-2 block w-full min-w-0 md:col-span-1 md:row-start-1 md:max-w-sm"
    />

    <div class="col-start-2 row-start-1 flex shrink-0 items-center gap-2 md:col-start-3">
      <app-link [routerLink]="['/favoritos']">
        <svg lucideHeart [size]="18" color="white" [strokeWidth]="1" title="Favoritos"></svg>
      </app-link>

      <button
        type="button"
        class="grid size-10 shrink-0 cursor-pointer place-items-center rounded-full bg-zinc-900/60 text-white transition-colors hover:bg-zinc-900/80"
        [attr.aria-label]="isDarkMode() ? 'Modo claro' : 'Modo escuro'"
        (click)="toggleTheme()"
      >
        @if (isDarkMode()) {
          <svg lucideSun [size]="18" aria-hidden="true"></svg>
        } @else {
          <svg lucideMoon [size]="18" aria-hidden="true"></svg>
        }
      </button>
    </div>
  </div>
</header>
