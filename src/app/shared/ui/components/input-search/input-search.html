<form class="flex items-center w-full h-8" (submit)="onSearchHeroes($event, searchInput.value)">
  <input
    #searchInput
    type="text"
    placeholder="Search your hero..."
    class="w-full h-full outline-none bg-zinc-900/70 text-white placeholder:text-zinc-500 border-none rounded-l-lg pl-4"
  />

  <button appButton variant="primary" size="lg" class="rounded-l-none h-full" type="submit">
    <svg lucideSearch [size]="12" color="white" [strokeWidth]="1" title="Home"></svg>
  </button>
</form>
