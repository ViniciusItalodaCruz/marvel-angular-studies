<form
  class="flex h-10 w-full items-center md:h-8"
  (submit)="onSearchMovies($event, searchInput.value)"
>
  <input
    #searchInput
    type="text"
    placeholder="Buscar filmes..."
    class="h-full min-w-0 flex-1 rounded-l-lg border-none bg-zinc-900/70 px-4 text-white outline-none placeholder:text-zinc-500"
  />

  <button
    appButton
    variant="primary"
    size="lg"
    class="h-full shrink-0 rounded-l-none"
    type="submit"
    aria-label="Buscar filmes"
  >
    <svg lucideSearch [size]="16" [strokeWidth]="1" aria-hidden="true"></svg>
  </button>
</form>
