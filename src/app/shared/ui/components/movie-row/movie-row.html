@if (hasMovies()) {
  <section class="container mx-auto px-4 py-8 text-white" [attr.aria-label]="title()">
    <div class="mb-4 flex items-center justify-between gap-4">
      <h2 class="text-2xl text-zinc-900 dark:text-white font-semibold">{{ title() }}</h2>

      @if (hasMoreThanTwoMovies()) {
        <div
          class="gap-2"
          [class]="
            hasMoreThanFiveMovies()
              ? 'flex'
              : hasMoreThanThreeMovies()
                ? 'flex lg:hidden'
                : 'flex sm:hidden'
          "
        >
          <button
            type="button"
            class="size-11 rounded-full bg-zinc-800 hover:bg-zinc-700 cursor-pointer"
            [attr.aria-label]="'Filme anterior em ' + title()"
            (click)="move(Direction.Left)"
          >
            <span aria-hidden="true">←</span>
          </button>

          <button
            type="button"
            class="size-11 rounded-full bg-zinc-800 hover:bg-zinc-700 cursor-pointer"
            [attr.aria-label]="'Próximo filme em ' + title()"
            (click)="move(Direction.Right)"
          >
            <span aria-hidden="true">→</span>
          </button>
        </div>
      }
    </div>

    <ul class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
      @for (movie of visibleMovies(); track movie.id; let index = $index) {
        <li [class]="index >= 3 ? 'hidden lg:block' : index === 2 ? 'hidden sm:block' : ''">
          <app-movie-card [movie]="movie" />
        </li>
      }
    </ul>
  </section>
} @else {
  <section class="container mx-auto px-4 py-8 text-white">
    <p class="text-zinc-900 dark:text-white">Não há filmes para exibir</p>
  </section>
}
